name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - chore/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Validate public manifest
        run: |
          node <<'NODE'
          const manifest = require('./manifest.json');
          if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(manifest.version)) {
            throw new Error('manifest.version must be strict x.y.z');
          }
          if (/obsidian/i.test(manifest.id)) {
            throw new Error('Community plugin ID must not contain "obsidian"');
          }
          if (!manifest.id || !manifest.name || !manifest.description || !manifest.author) {
            throw new Error('manifest is missing required public metadata');
          }
          NODE

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          if grep -R -nE --exclude-dir=.git --exclude='package-lock.json' \
            '(GOCSPX-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo "Potential credential/private key found in repository."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck and build
        run: npm run build

      - name: Reject secrets in bundle
        shell: bash
        run: |
          if grep -nE '(GOCSPX-[A-Za-z0-9_-]{10,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' main.js; then
            echo "Potential credential/private key found in built plugin."
            exit 1
          fi

      - name: Package test build
        run: |
          mkdir -p dist/tasks-gcal-sync
          cp main.js manifest.json styles.css dist/tasks-gcal-sync/

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: tasks-gcal-sync-${{ github.sha }}
          path: dist/tasks-gcal-sync
          retention-days: 7
