name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Show lockfile changes
        run: git diff -- package-lock.json || true
      - name: Typecheck and build
        run: npm run build
