name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict x.y.z SemVer without a v prefix: $tag"
            exit 1
          fi

          if [[ "$tag" != "$manifest_version" || "$tag" != "$package_version" ]]; then
            echo "Tag, manifest.json and package.json versions must match."
            echo "tag=$tag manifest=$manifest_version package=$package_version"
            exit 1
          fi

      - name: Build plugin
        run: npm run build

      - name: Create release bundle
        run: |
          mkdir tasks-gcal-sync
          cp main.js manifest.json styles.css README.md LICENSE tasks-gcal-sync/
          zip -r tasks-gcal-sync.zip tasks-gcal-sync

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            tasks-gcal-sync.zip main.js manifest.json styles.css
