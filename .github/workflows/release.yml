name: Release Obsidian Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build plugin
        run: npm run build

      - name: Create release bundle
        run: |
          mkdir obsidian-tasks-gcal-sync
          cp main.js manifest.json styles.css README.md LICENSE obsidian-tasks-gcal-sync/
          zip -r obsidian-tasks-gcal-sync.zip obsidian-tasks-gcal-sync

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            obsidian-tasks-gcal-sync.zip main.js manifest.json styles.css
