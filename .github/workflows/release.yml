name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$tag' must exactly match manifest version '$version'."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build plugin
        run: npm run build

      - name: Create release bundle
        run: |
          mkdir tasks-gcal-sync
          cp main.js manifest.json styles.css README.md LICENSE NOTICE tasks-gcal-sync/
          zip -r tasks-gcal-sync.zip tasks-gcal-sync

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            tasks-gcal-sync.zip main.js manifest.json styles.css
